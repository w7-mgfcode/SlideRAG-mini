# Requires M1 manifests (uv.lock/pyproject.toml, Dockerfile and CI workflow).
# Before merging bot PRs, link an open issue and normalize the squash title.
version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 3
  labels:
  - area:repo
  commit-message:
    prefix: chore(repo)
  groups:
    python-patch:
      patterns:
      - '*'
      update-types:
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 3
  labels:
  - area:ci
  commit-message:
    prefix: chore(ci)
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 3
  labels:
  - area:deploy
  commit-message:
    prefix: chore(deploy)
  # EXEC-01 fixes the runtime at Python 3.12; patch/digest updates remain eligible.
  ignore:
  - dependency-name: python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  groups:
    docker-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
